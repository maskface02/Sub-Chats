name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (typecheck, unit, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTH_SECRET: ci-dummy-secret-do-not-use-in-prod-32ch
      # Harmless offline sentinel: `next build` never connects to the DB
      # (route handlers are force-dynamic), but the value must be a postgres://
      # URL, never `file:` (pglite dev driver — US-503 / AC.7, US-511 AC.20).
      DATABASE_URL: postgres://offline:offline@localhost:5432/offline
      AUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No `lint` step: the repo has no ESLint config, and `next lint` in
      # Next.js 15 is interactive (prompts to install/configure ESLint) when
      # none exists, which hangs CI. Re-add lint only if an ESLint config is
      # introduced (US-511 AC.20 removal).
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  # e2e (Playwright) job REMOVED / quarantined per phase-5 spec §9:
  # "E2E in CI (Playwright needs a live provider; documented as manual gate)"
  # see .orchestrator/specs/phase-5.md §9 out-of-scope list. E2E is run
  # manually post-deploy via docs/runbook.md smoke checklist (US-507 AC.12).
