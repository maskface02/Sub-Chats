name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (lint, typecheck, unit, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTH_SECRET: ci-dummy-secret-do-not-use-in-prod-32ch
      DATABASE_URL: file:./.ci-build.db
      AUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        # Theoretical for phase 0: node_modules is not committed; first CI run
        # will resolve and cache all deps. Once Backend/Frontend land code,
        # package-lock.json will be generated and `npm ci` becomes reproducible.
        run: npm ci || npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    env:
      AUTH_SECRET: ci-dummy-secret-do-not-use-in-prod-32ch
      DATABASE_URL: file:./.ci-e2e.db
      AUTH_URL: http://localhost:3000
      OLLAMA_BASE_URL: http://localhost:11434/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        # OPENAI_API_KEY is optional; if absent the tests must fall back to
        # Ollama or assert the no-provider banner per spec US-008.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
